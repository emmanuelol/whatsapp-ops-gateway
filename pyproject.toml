[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-ops-gateway"
dynamic = ["version"]
description = "SRE-hardened WhatsApp gateway client with fork isolation, deterministic idempotency, and automated dispatch gatekeeping."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31.0",
    "urllib3>=1.26.0",
    "tenacity>=8.2.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.hatch.version]
path = "src/whatsapp_ops_gateway/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_ops_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
