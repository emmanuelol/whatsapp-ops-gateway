name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Strict Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dev Dependencies
        run: uv sync --all-extras

      - name: Static Clean-Room Leak Scan
        env:
          BLACKLIST_REGEX: ${{ secrets.BLACKLIST_REGEX }}
        run: bash ./scripts/check_blacklist.sh .

      - name: Ruff Lint Check
        run: uv run ruff check src/ tests/

      - name: Strict Static Type Check (PEP 561)
        run: uv run mypy src/

      - name: Run Fast Unit Tests with Coverage
        run: uv run coverage run -m pytest tests/ -q && uv run coverage report

  container-verify:
    name: Container Build, Test & Security Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Static Clean-Room Leak Scan
        env:
          BLACKLIST_REGEX: ${{ secrets.BLACKLIST_REGEX }}
        run: bash ./scripts/check_blacklist.sh .

      - name: Build Container Image
        run: make build

      - name: Run Integration Test Suite
        run: make test

      - name: Security & Vulnerability Audit
        run: bash ./scripts/audit_image.sh
