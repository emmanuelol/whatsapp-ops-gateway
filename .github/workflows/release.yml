name: Release & Publishing Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release-packages:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build Source and Wheel Distributions
        run: uv build

      - name: Run Clean-Room Leak Scan
        env:
          BLACKLIST_REGEX: ${{ secrets.BLACKLIST_REGEX }}
        run: bash ./scripts/check_blacklist.sh .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c66037f3756e7204 # v2.2.12
        with:
          files: dist/*
          generate_release_notes: true

  release-container:
    name: Build, Audit & Publish GHCR Container
    runs-on: ubuntu-latest
    needs: [release-packages]
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        run: make build

      - name: Audit Container Image
        run: bash ./scripts/audit_image.sh
